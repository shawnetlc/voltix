name: Build Windows (Installer & EXE)

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: 'Target Architecture'
        type: choice
        default: 'x64'
        options:
          - 'x64'
          - 'arm64'

env:
  FLUTTER_VERSION: '3.44.1'

jobs:
  build-windows:
    name: Build Windows (${{ inputs.architecture || 'x64' }})
    runs-on: ${{ inputs.architecture == 'arm64' && 'windows-11-arm' || 'windows-latest' }}
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        if: ${{ inputs.architecture != 'arm64' }}
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Set up Flutter (Native ARM64)
        if: ${{ inputs.architecture == 'arm64' }}
        shell: pwsh
        run: |
          git clone https://github.com/flutter/flutter.git --branch $env:FLUTTER_VERSION --depth 1 C:\flutter
          echo "C:\flutter\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

      - name: Enable Windows Desktop in Flutter
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop

      - name: Build Windows Installer
        shell: pwsh
        run: |
          .\build-windows.ps1 -Architecture ${{ inputs.architecture || 'x64' }} -NoBump

      - name: Package Standalone Release Folder as ZIP
        shell: pwsh
        run: |
          $arch = "${{ inputs.architecture || 'x64' }}"
          $releaseDir = "build\windows\$arch\runner\Release"
          if (Test-Path $releaseDir) {
            Compress-Archive -Path "$releaseDir\*" -DestinationPath "Voltix_Windows_${arch}_Portable.zip" -Force
          }

      - name: Upload Installer EXE
        uses: actions/upload-artifact@v4
        with:
          name: Voltix-Windows-${{ inputs.architecture || 'x64' }}-Installer
          path: |
            build/windows/installer/*.exe
            Voltix*.exe
          if-no-files-found: warn

      - name: Upload Portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Voltix-Windows-${{ inputs.architecture || 'x64' }}-Portable
          path: Voltix_Windows_*_Portable.zip
          if-no-files-found: warn
